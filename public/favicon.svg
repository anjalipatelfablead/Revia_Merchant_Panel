<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="reviaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A753"/>
      <stop offset="100%" stop-color="#9E782F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A1615" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#reviaGrad)"/>
  <!-- Inner subtle border line -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Monogram R -->
  <text x="31" y="45" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">R</text>
  <!-- Accent Sparkle Dot -->
  <circle cx="47" cy="17" r="3.5" fill="#FFFFFF"/>
</svg>
